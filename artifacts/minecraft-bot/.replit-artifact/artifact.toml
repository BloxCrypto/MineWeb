kind = "web"
previewPath = "/"
title = "Minecraft Bot Console"
description = "A browser control console for connecting a Mineflayer Minecraft bot to a server, monitoring its status and logs, and sending chat commands."
version = "1.0.0"
id = "artifacts/minecraft-bot"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23418

[services.development]
run = "pnpm --filter @workspace/minecraft-bot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/minecraft-bot", "run", "build" ]
serve = "static"
publicDir = "artifacts/minecraft-bot/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23418"
BASE_PATH = "/"
